<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>GIF DROP — 動画をGIFに</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080b12'/%3E%3Cpath d='M8 9h16v14H8z' fill='%23b6ff3b'/%3E%3Cpath d='m13 12 8 4-8 4z' fill='%23080b12'/%3E%3C/svg%3E">
  <script src="vendor/gif.js"></script>
  <style>
    :root{color-scheme:dark;--ink:#f7f8fb;--muted:#9ca4b5;--lime:#b6ff3b;--panel:#101621;--line:#293244;--bg:#080b12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#1a2434 0,transparent 35%),var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}.shell{width:min(1080px,calc(100% - 32px));margin:auto;padding:28px 0 48px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}.brand{font:800 1.05rem/1 monospace;letter-spacing:.16em}.brand i{display:inline-block;width:10px;height:10px;background:var(--lime);margin-right:10px;box-shadow:0 0 18px #b6ff3baa}.local{color:var(--muted);font-size:.78rem;border:1px solid var(--line);padding:7px 10px;border-radius:999px}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:22px}.stage,.controls{background:#101621d9;border:1px solid var(--line);border-radius:24px}.stage{padding:18px;min-height:580px;display:flex;flex-direction:column}.drop{position:relative;flex:1;min-height:440px;border:1px dashed #455166;border-radius:17px;display:grid;place-items:center;overflow:hidden;background:#0b1018;transition:.2s}.drop.drag{border-color:var(--lime);background:#b6ff3b0d}.drop video,.drop img{width:100%;height:100%;position:absolute;inset:0;object-fit:contain;background:#06080d}.remove{display:none;position:absolute;z-index:3;top:12px;right:12px;width:42px;height:42px;padding:0;border:1px solid #ffffff2b;border-radius:50%;background:#080b12d9;color:#fff;font-size:1.45rem;line-height:1;backdrop-filter:blur(8px)}.empty{text-align:center;padding:30px;z-index:1}.empty .icon{width:74px;height:74px;border:1px solid #3a4559;border-radius:22px;display:grid;place-items:center;margin:0 auto 22px;color:var(--lime);font-size:2rem}.empty strong{display:block;font-size:1.15rem;margin-bottom:8px}.empty span{color:var(--muted);font-size:.9rem}.choose{display:inline-flex;margin-top:20px;padding:11px 16px;border-radius:10px;background:var(--ink);color:#080b12;font-weight:750;cursor:pointer}.filemeta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.8rem;padding:14px 4px 0}.controls{padding:27px}.eyebrow{color:var(--lime);font:700 .75rem/1 monospace;letter-spacing:.12em}.controls h1{font-size:clamp(2rem,4vw,3.6rem);line-height:.95;letter-spacing:-.06em;margin:16px 0 30px}.field{padding:20px 0;border-top:1px solid var(--line)}label{display:flex;justify-content:space-between;font-size:.92rem;font-weight:700;margin-bottom:13px}.value{font:700 .84rem/1 monospace;color:var(--lime)}select,input[type=range]{width:100%}select{appearance:none;background:#0b1018;color:var(--ink);border:1px solid #354057;border-radius:12px;padding:13px 42px 13px 14px;font-size:1rem;background-image:linear-gradient(45deg,transparent 50%,var(--lime) 50%),linear-gradient(135deg,var(--lime) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 12px) 18px;background-size:6px 6px;background-repeat:no-repeat}input[type=range]{accent-color:var(--lime)}button{width:100%;border:0;border-radius:13px;padding:16px;background:var(--lime);color:#0a0d12;font-size:1rem;font-weight:850;cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px);box-shadow:0 10px 30px #b6ff3b22}button.remove:hover{background:#202938;box-shadow:none;transform:none}button:disabled{opacity:.35;cursor:not-allowed;transform:none}.status{min-height:42px;margin-top:14px;color:var(--muted);font-size:.82rem;line-height:1.55}.progress{height:4px;background:#20293a;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:var(--lime);transition:.2s}.download{display:none;margin-top:10px;text-align:center;color:var(--lime);font-weight:700;text-decoration:none}.privacy{margin-top:26px;color:#727c8e;font-size:.76rem;line-height:1.6}@media(max-width:780px){.grid{grid-template-columns:1fr}.stage{min-height:420px}.drop{min-height:320px}.controls h1{font-size:2.6rem}header{margin-bottom:22px}}
  </style>
</head>
<body>
<main class="shell"><header><div class="brand"><i></i>GIF DROP</div><div class="local">ブラウザ内で変換</div></header><section class="grid">
  <div class="stage"><div class="drop" id="drop"><input id="file" type="file" accept="video/*" hidden><div class="empty" id="empty"><div class="icon">＋</div><strong>動画をここにドロップ</strong><span>MP4・WebM・MOV など</span><br><label class="choose" for="file">動画を選ぶ</label></div><video id="video" controls hidden></video><img id="result" alt="変換したGIF" hidden><button class="remove" id="remove" type="button" aria-label="動画を削除して選び直す" title="動画を削除">×</button></div><div class="filemeta"><span id="filename">まだ動画が選ばれていません</span><span id="dimensions">—</span></div></div>
  <aside class="controls"><div class="eyebrow">VIDEO → GIF</div><h1>好きなサイズで、<br>すぐGIFに。</h1>
    <div class="field"><label for="resolution">出力解像度</label><select id="resolution"><option value="320">小さめ・320px</option><option value="480" selected>標準・480px</option><option value="720">高画質・720px</option><option value="1080">フルHD・1080px</option><option value="original">元のサイズ</option></select></div>
    <div class="field"><label for="fps">フレームレート <span class="value" id="fpsval">10 FPS</span></label><input id="fps" type="range" min="5" max="20" value="10" step="1"></div>
    <button id="convert" disabled>GIFに変換</button><div class="progress"><i id="bar"></i></div><div class="status" id="status">動画を選ぶと変換できます。</div><a class="download" id="download" download="converted.gif">GIFをダウンロード</a><p class="privacy">動画はサーバーへ送信されません。変換はこのブラウザの中だけで行われます。</p>
  </aside>
</section></main>
<script>
const $=s=>document.querySelector(s), file=$('#file'),drop=$('#drop'),video=$('#video'),empty=$('#empty'),result=$('#result'),remove=$('#remove'),convert=$('#convert'),statusEl=$('#status'),bar=$('#bar'),download=$('#download'),fps=$('#fps'),fpsval=$('#fpsval'),resolution=$('#resolution');let selected=null,objectUrl=null,resultUrl=null,workerUrl=null,runId=0;
fps.oninput=()=>fpsval.textContent=fps.value+' FPS';['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));file.onchange=()=>load(file.files[0]);
function load(f){if(!f||!f.type.startsWith('video/')){statusEl.textContent='動画ファイルを選んでください。';return}selected=f;if(objectUrl)URL.revokeObjectURL(objectUrl);if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=null;objectUrl=URL.createObjectURL(f);video.src=objectUrl;video.hidden=false;result.hidden=true;empty.hidden=true;remove.style.display='block';download.style.display='none';$('#filename').textContent=f.name;statusEl.textContent='動画を読み込んでいます…';video.onloadedmetadata=()=>{$('#dimensions').textContent=video.videoWidth+' × '+video.videoHeight+' / '+video.duration.toFixed(1)+'秒';convert.disabled=false;statusEl.textContent='準備完了。最初の10秒までをGIFにします。'}}
remove.onclick=()=>{runId++;video.pause();video.removeAttribute('src');video.load();if(objectUrl)URL.revokeObjectURL(objectUrl);if(resultUrl)URL.revokeObjectURL(resultUrl);objectUrl=resultUrl=null;selected=null;file.value='';video.hidden=true;result.hidden=true;result.removeAttribute('src');empty.hidden=false;remove.style.display='none';download.style.display='none';download.removeAttribute('href');$('#filename').textContent='まだ動画が選ばれていません';$('#dimensions').textContent='—';bar.style.width='0';statusEl.textContent='動画を選ぶと変換できます。';convert.disabled=true;convert.textContent='GIFに変換'};
function seek(t){return new Promise((ok,ng)=>{const done=()=>{video.removeEventListener('seeked',done);ok()};video.addEventListener('seeked',done);video.currentTime=Math.min(t,Math.max(0,video.duration-.001));setTimeout(()=>ng(new Error('フレームの読み込みに失敗しました')),5000)})}
convert.onclick=async()=>{if(!selected)return;const currentRun=++runId,sourceName=selected.name;convert.disabled=true;download.style.display='none';result.hidden=true;video.hidden=false;bar.style.width='2%';try{if(!window.GIF)throw new Error('変換ライブラリを読み込めませんでした。ページを再読み込みしてください。');if(!workerUrl){const r=await fetch('vendor/gif.worker.js');workerUrl=URL.createObjectURL(await r.blob())}const max=resolution.value==='original'?video.videoWidth:+resolution.value;const scale=Math.min(1,max/video.videoWidth),w=Math.max(2,Math.round(video.videoWidth*scale/2)*2),h=Math.max(2,Math.round(video.videoHeight*scale/2)*2),rate=+fps.value,dur=Math.min(video.duration,10),frames=Math.max(1,Math.ceil(dur*rate)),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=w;canvas.height=h;const gif=new GIF({workers:2,quality:10,width:w,height:h,workerScript:workerUrl});statusEl.textContent='フレームを取り出しています…';video.pause();for(let i=0;i<frames;i++){if(currentRun!==runId)return;await seek(i/rate);ctx.drawImage(video,0,0,w,h);gif.addFrame(ctx,{copy:true,delay:1000/rate});bar.style.width=(5+i/frames*65)+'%'}gif.on('progress',p=>{if(currentRun!==runId)return;bar.style.width=(70+p*28)+'%';statusEl.textContent='GIFを書き出しています… '+Math.round(p*100)+'%'});gif.on('finished',blob=>{if(currentRun!==runId)return;if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=URL.createObjectURL(blob);result.src=resultUrl;result.hidden=false;video.hidden=true;download.href=resultUrl;download.download=sourceName.replace(/\.[^.]+$/,'')+'-'+w+'x'+h+'.gif';download.style.display='block';bar.style.width='100%';statusEl.textContent='完成：'+w+' × '+h+' / '+(blob.size/1024/1024).toFixed(1)+' MB';convert.disabled=false;convert.textContent='もう一度変換'});gif.render()}catch(e){if(currentRun!==runId)return;statusEl.textContent=e.message||'変換に失敗しました。';bar.style.width='0';convert.disabled=false;}}
</script></body></html>
