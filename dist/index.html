<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090c11">
  <title>GIF DROP</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=1.1.0"><script src="vendor/gif.js"></script>
</head>
<body><main class="app-shell" id="appShell">
  <header class="titlebar"><div class="brand"><img src="icon.svg" alt=""><span>GIF DROP</span></div><div class="title-actions"><span class="local-badge"><i></i><span data-i18n="local">端末内で変換</span></span><button class="language" id="language" type="button" aria-label="言語を切り替える">EN</button></div></header>
  <section class="workspace empty-state" id="workspace">
    <aside class="inspector">
      <div class="inspector-head"><span class="section-kicker">OUTPUT</span><button class="icon-button" id="remove" type="button" data-i18n-aria="remove" disabled>×</button></div>
      <div class="source-card"><div class="source-thumb" id="sourceThumb"><span>—</span></div><div class="source-copy"><strong id="filename" data-i18n="noVideo">動画が選択されていません</strong><span id="dimensions">—</span></div></div>
      <div class="setting"><label for="resolution" data-i18n="resolution">出力解像度</label><div class="select-wrap"><select id="resolution"><option value="320" data-i18n="resSmall">小さめ · 320 px</option><option value="480" selected data-i18n="resStandard">標準 · 480 px</option><option value="720" data-i18n="resHigh">高画質 · 720 px</option><option value="1080" data-i18n="resFull">フルHD · 1080 px</option><option value="original" data-i18n="resOriginal">オリジナル</option></select></div></div>
      <div class="setting"><div class="setting-row"><label for="fps">FPS</label><output id="fpsValue">10</output></div><input id="fps" type="range" min="5" max="20" value="10" step="1"><div class="scale"><span>5</span><span>20</span></div></div>
      <div class="setting"><label data-i18n="quality">品質</label><div class="segments" id="quality" role="radiogroup"><button type="button" data-quality="16" data-i18n="qualityLight">軽量</button><button type="button" data-quality="10" class="active" data-i18n="qualityBalanced">標準</button><button type="button" data-quality="5" data-i18n="qualityFine">精細</button></div></div>
      <div class="summary"><div><span data-i18n="selection">選択範囲</span><strong id="durationLabel">—</strong></div><div><span data-i18n="frames">推定フレーム</span><strong id="frameLabel">—</strong></div></div>
      <div class="warning" id="warning" hidden></div><button class="convert-button" id="convert" type="button" disabled><span data-i18n="convert">GIFをつくる</span><i></i></button><p class="privacy" data-i18n="privacy">動画は外部へ送信されません。</p>
    </aside>
    <section class="editor">
      <div class="drop-zone" id="dropZone"><input id="file" type="file" accept="video/*" hidden><div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="empty-prompt" id="emptyPrompt"><div class="drop-mark"><span></span><span></span><span></span></div><strong data-i18n="dropTitle">動画をドロップ</strong><p data-i18n="dropHint">またはMacから動画を選択</p><label for="file" class="choose-button" data-i18n="choose">動画を選ぶ</label><small>MP4 · MOV · WebM</small></div>
        <video id="video" playsinline hidden></video><img id="result" alt="Converted GIF" hidden><button class="play-button" id="play" type="button" aria-label="再生" hidden><span></span></button><div class="drop-overlay"><span data-i18n="dropNow">ここにドロップ</span></div>
        <div class="render-overlay" id="renderOverlay" hidden><div class="frame-stack" id="frameStack"><i></i><i></i><i></i><i></i></div><strong id="renderTitle" data-i18n="collecting">フレームを集めています</strong><span id="renderPercent">0%</span></div>
      </div>
      <div class="timeline-panel" id="timelinePanel"><div class="timeline-head"><div><span data-i18n="range">GIFにする範囲</span><strong id="rangeDuration">—</strong></div><button id="previewRange" class="text-button" type="button" disabled><span class="mini-play"></span><span data-i18n="preview">範囲を再生</span></button></div>
        <div class="filmstrip" id="filmstrip"><canvas id="filmCanvas"></canvas><div class="shade left" id="leftShade"></div><div class="shade right" id="rightShade"></div><div class="selection-box" id="selectionBox"></div><input id="rangeStart" class="range range-start" type="range" min="0" max="10000" step="1" value="0" aria-label="開始時刻"><input id="rangeEnd" class="range range-end" type="range" min="0" max="10000" step="1" value="10000" aria-label="終了時刻"><i class="playhead" id="playhead"></i></div>
        <div class="time-controls"><label><span data-i18n="start">開始</span><input id="startTime" type="text" value="00:00.00" inputmode="decimal"></label><span class="time-divider">—</span><label><span data-i18n="end">終了</span><input id="endTime" type="text" value="00:00.00" inputmode="decimal"></label><span class="total-time" id="totalTime">/ 00:00.00</span></div>
      </div>
      <section class="result-bar" id="resultBar" hidden><div><span class="success-dot"></span><div><strong data-i18n="complete">GIFが完成しました</strong><small id="resultMeta"></small></div></div><div class="result-actions"><button id="another" type="button" data-i18n="another">別の動画</button><button id="reveal" type="button" data-i18n="reveal" hidden>Finderで表示</button><button id="download" class="primary" type="button" data-i18n="save">GIFを保存</button></div></section>
    </section>
  </section><div class="toast" id="toast" role="status"></div>
</main><script src="i18n.js?v=1.1.0-4"></script><script src="app.js?v=1.1.0-4"></script></body></html>
